# ClearJSON License Server — Cloudflare Workers config
name = "clearjson-license"
main = "src/index.js"
compatibility_date = "2025-07-01"

# Bind a D1 database
[[d1_databases]]
binding = "DB"
database_name = "clearjson-license-db"
database_id = "66d28ea7-b5f7-45ed-a55c-ade5ea26197f"

# Secrets (set via `npx wrangler secret put <KEY>`):
#   ADMIN_API_KEY         — Admin API key for generate/list endpoints
#   RESEND_API_KEY        — Resend API key for sending license key emails
#   CREEM_WEBHOOK_SECRET  — Creem webhook signing secret

# Custom domain routing:
#   Cloudflare Dashboard → Workers & Pages → clearjson-license → Triggers
#   → Custom Domains → Add "api.wayknow.tech/clearjson"
#   Requests to api.wayknow.tech/clearjson/* are routed here;
#   the Worker strips the /clearjson prefix.
