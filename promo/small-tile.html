<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 440px; height: 280px; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #0a0a1a 0%, #0f0f2a 40%, #111136 100%);
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    display: flex; align-items: center; gap: 24px;
    padding: 32px 40px;
    background: rgba(24, 24, 48, 0.6);
    border: 1px solid rgba(137, 180, 250, 0.25);
    border-radius: 20px;
  }
  .icon-wrap {
    position: relative; width: 80px; height: 80px; flex-shrink: 0;
    background: linear-gradient(135deg, #89b4fa 0%, #74c7ec 100%);
    border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 32px rgba(137, 180, 250, 0.35);
  }
  .braces {
    font-family: 'SF Mono', 'Menlo', 'Monaco', 'Consolas', monospace;
    font-size: 40px; font-weight: 700; color: #1e1e2e;
    letter-spacing: -2px; line-height: 1;
  }
  .text-block { display: flex; flex-direction: column; gap: 4px; }
  .name {
    font-size: 28px; font-weight: 700; color: #fff;
    letter-spacing: -0.5px; line-height: 1;
  }
  .tagline {
    font-size: 15px; color: #89b4fa; font-weight: 500;
    letter-spacing: 0.2px;
  }
  .sub {
    margin-top: 4px; font-size: 12px; color: #5c5c84;
    display: flex; align-items: center; gap: 8px;
  }
  .sub span { display: flex; align-items: center; gap: 4px; }
  .dot { width: 4px; height: 4px; background: #252548; border-radius: 50%; }
</style>
</head>
<body>
<div class="card">
  <div class="icon-wrap">
    <div class="braces">{ }</div>
  </div>
  <div class="text-block">
    <div class="name">ClearJSON</div>
    <div class="tagline">JSON Viewer &amp; Formatter</div>
    <div class="sub">
      <span>🔒 100% Local</span>
      <div class="dot"></div>
      <span>🆓 Free Forever</span>
      <div class="dot"></div>
      <span>🦾 Open Source</span>
    </div>
  </div>
</div>
</body>
</html>
