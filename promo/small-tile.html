<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 440px; height: 280px; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #0a0a1a 0%, #0f0f2a 40%, #111136 100%);
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    display: flex; align-items: center; gap: 24px;
    padding: 32px 40px;
    background: rgba(24, 24, 48, 0.6);
    border: 1px solid rgba(137, 180, 250, 0.25);
    border-radius: 20px;
  }
  .icon-wrap { position: relative; width: 80px; height: 80px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .text-block { display: flex; flex-direction: column; gap: 4px; }
  .name {
    font-size: 28px; font-weight: 700; color: #fff;
    letter-spacing: -0.5px; line-height: 1;
  }
  .tagline {
    font-size: 15px; color: #89b4fa; font-weight: 500;
    letter-spacing: 0.2px;
  }
  .sub {
    margin-top: 4px; font-size: 12px; color: #5c5c84;
    display: flex; align-items: center; gap: 8px;
  }
  .sub span { display: flex; align-items: center; gap: 4px; }
  .dot { width: 4px; height: 4px; background: #252548; border-radius: 50%; }
</style>
</head>
<body>
<div class="card">
  <div class="icon-wrap">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#282840"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  <rect x="33" y="26" width="12" height="77" rx="2" fill="#89b4fa"/>
  <rect x="84" y="26" width="12" height="77" rx="2" fill="#89b4fa"/>
</svg>
  </div>
  <div class="text-block">
    <div class="name">ClearJSON</div>
    <div class="tagline">A JSON Viewer You Can Trust</div>
    <div class="sub">
      <span>🔒 100% Local</span>
      <div class="dot"></div>
      <span>🆓 Free Forever</span>
      <div class="dot"></div>
      <span>🚫 No Ads</span>
    </div>
  </div>
</div>
</body>
</html>
